server:
  port: 8080
  # Trust X-Forwarded-* from nginx or a platform proxy (HTTPS termination).
  forward-headers-strategy: framework

spring:
  application:
    name: darukaa-earth
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:darukaa_earth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:darukaa}
    password: ${MYSQL_PASSWORD:darukaa_dev}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns DDL. Hibernate only checks that entities match the migrated schema.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:8f3a91c7e2b54d8a6f1c9e7b3a5d2f8c0e4a6b9d1f7c3}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Set true in production so a leftover default secret cannot start the API.
    fail-on-weak-secret: ${JWT_FAIL_ON_WEAK_SECRET:false}
  admin:
    seed: ${APP_ADMIN_SEED:true}
    email: ${APP_ADMIN_EMAIL:admin@darukaa.earth}
    password: ${APP_ADMIN_PASSWORD:ChangeMe_Admin_123!}
    name: ${APP_ADMIN_NAME:Darukaa Admin}
  seed:
    # Generated mock projects/sites/analytics for charts. Not sensor data.
    # Override with APP_SEED_DEMO=false. Tests set this false.
    demo: ${APP_SEED_DEMO:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
