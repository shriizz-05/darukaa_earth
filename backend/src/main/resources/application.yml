server:
  # Railway/Render/Fly set PORT. Local and Compose keep 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  # Trust X-Forwarded-* from nginx or a platform proxy (HTTPS termination).
  forward-headers-strategy: framework

spring:
  application:
    name: darukaa-earth
  datasource:
    # MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD are Railway MySQL plugin names.
    # Local desktop MySQL is 3307 (3306 is a different instance). Railway sets MYSQL_PORT/MYSQLPORT.
    url: jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:127.0.0.1}}:${MYSQL_PORT:${MYSQLPORT:3307}}/${MYSQL_DATABASE:${MYSQLDATABASE:darukaa_earth}}?sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=20000
    username: ${MYSQL_USER:${MYSQLUSER:darukaa}}
    password: ${MYSQL_PASSWORD:${MYSQLPASSWORD:darukaa_dev}}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns DDL. Hibernate only checks that entities match the migrated schema.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Comma-separated origins or patterns (https://*.vercel.app). Wildcards need origin patterns in CORS config.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.trycloudflare.com,https://*.vercel.app,https://*.netlify.app,https://*.up.railway.app,*}
  jwt:
    secret: ${JWT_SECRET:8f3a91c7e2b54d8a6f1c9e7b3a5d2f8c0e4a6b9d1f7c3}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Set true in production so a leftover default secret cannot start the API.
    fail-on-weak-secret: ${JWT_FAIL_ON_WEAK_SECRET:false}
  admin:
    seed: ${APP_ADMIN_SEED:true}
    email: ${APP_ADMIN_EMAIL:admin@darukaa.earth}
    password: ${APP_ADMIN_PASSWORD:ChangeMe_Admin_123!}
    name: ${APP_ADMIN_NAME:Darukaa Admin}
  seed:
    # Generated mock projects/sites/analytics for charts. Not sensor data.
    # Override with APP_SEED_DEMO=false. Tests set this false.
    demo: ${APP_SEED_DEMO:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
