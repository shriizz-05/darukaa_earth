# CI: every push and pull request runs these jobs on GitHub.
# Open the repo on GitHub → Actions tab to see results.
# No deploy job: pushing images to a registry needs credentials that are
# not stored in this repository. Build locally with: docker compose build
name: CI

on: [push, pull_request]

jobs:
  # React app: lint, Prettier, Vitest, production build (no Mapbox secret needed).
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Spring Boot: Maven verify = tests + Spotless. Docker on the runner
  # lets Testcontainers MySQL tests run; they skip if Docker is missing.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and Spotless check
        run: ./mvnw -B -q verify
